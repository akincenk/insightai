[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Every warning fails the run. The one exception is emitted by PyMuPDF's SWIG bindings at
# import time (third-party C extension, nothing we can fix); escalating it crashes the interpreter.
filterwarnings = ["error", "ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
